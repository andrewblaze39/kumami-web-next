<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap');
*{margin:0;box-sizing:border-box} body{width:1200px;height:630px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;
background:radial-gradient(circle at 18% 20%,rgba(0,194,199,.28),transparent 45%),radial-gradient(circle at 85% 85%,rgba(94,233,168,.18),transparent 45%),#07111a;color:#f1f7f4;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px}
.wrap{position:absolute;left:80px;top:90px;width:900px}
.logo{height:84px;margin-bottom:44px}
h1{font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
h1 span{color:#00c2c7}
p{margin-top:24px;font-size:26px;line-height:1.4;color:#a9c2b8;font-weight:500}
.pills{margin-top:36px;display:flex;gap:12px}
.pills b{font-size:18px;font-weight:800;padding:10px 18px;border-radius:999px;border:1.5px solid rgba(0,194,199,.5);color:#7ff0f2;background:rgba(0,194,199,.08)}
.bear{position:absolute;right:56px;top:190px;height:270px;opacity:.95;filter:drop-shadow(0 20px 60px rgba(0,194,199,.35))}
.url{position:absolute;left:80px;bottom:44px;font-size:20px;font-weight:800;color:#5f786e;letter-spacing:.04em}
</style></head><body><div class="grid"></div>
<div class="wrap"><img class="logo" src="../../public/logo-kumami-white.png">
<h1>Where Web3 <span>finally makes sense.</span></h1>
<p>Crypto news, Web3 education and real-time market intelligence — in one place.</p>
<div class="pills"><b>News</b><b>Academy</b><b>Market tools</b><b>Pro</b></div></div>
<div class="url">KUMAMI.WORLD</div></body></html>
